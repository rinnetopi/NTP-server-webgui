<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · NTP Server Control</title>
<link rel="stylesheet" href="{{ url_for('static', filename='assets/site.css') }}">
<style>
* { box-sizing:border-box; margin:0; padding:0;
    font-family:'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
body { background:#121212; color:#e0e0e0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.5rem 1rem; }
.card { width:100%; max-width:24rem; padding:2rem 1.75rem; border-radius:1.25rem;
        background:linear-gradient(145deg,#1e1e1e,#161616); border:1px solid rgba(255,255,255,.03);
        box-shadow:6px 6px 16px #0b0b0b, -6px -6px 16px #1b1b1b; }
.brand { display:flex; align-items:center; gap:.875rem; margin-bottom:1.75rem; }
.logo { width:2.75rem; height:2.75rem; border-radius:.875rem; background:linear-gradient(135deg,#1565c0,#0d47a1);
        display:flex; align-items:center; justify-content:center; color:#fff; border:1px solid rgba(255,255,255,.1); }
.logo svg { width:1.4rem; height:1.4rem; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
h1 { font-size:1.125rem; font-weight:700; color:#fff; }
.sub { font-size:.75rem; color:#9ca3af; margin-top:.125rem; }
label { display:block; font-size:.75rem; font-weight:500; color:#9ca3af; margin:0 0 .375rem; }
.field + .field { margin-top:1rem; }
input { width:100%; padding:.75rem 1rem; border-radius:.75rem; font-size:.875rem; color:#fff; background:#151515;
        border:1px solid rgba(255,255,255,.05); box-shadow:inset 3px 3px 6px #0d0d0d, inset -3px -3px 6px #1d1d1d; }
input:focus { outline:none; border-color:#1565c0; box-shadow:inset 3px 3px 6px #0d0d0d, inset -3px -3px 6px #1d1d1d, 0 0 10px rgba(21,101,192,.3); }
button { width:100%; margin-top:1.5rem; padding:.8rem 1.5rem; border-radius:.75rem; border:1px solid rgba(255,255,255,.08);
         background:linear-gradient(145deg,#1565c0,#0d47a1); color:#fff; font-size:.875rem; font-weight:700; cursor:pointer;
         box-shadow:4px 4px 12px #0a0a0a; }
button:active { transform:translateY(2px); }
.error { margin-top:1rem; padding:.625rem .875rem; border-radius:.75rem; font-size:.8125rem; color:#fb7185;
         background:rgba(244,63,94,.1); border:1px solid rgba(244,63,94,.3); }
</style>
</head>
<body>
  <form class="card" method="post" action="{{ url_for('login') }}">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
      <div>
        <h1>NTP Server Control</h1>
        <p class="sub">Sign in to manage this Raspberry Pi</p>
      </div>
    </div>
    <div class="field">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
