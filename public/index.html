<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NTP Server Web GUI</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="layout">
      <section class="panel">
        <div class="panel-header">
          <div>
            <p class="eyebrow">Raspberry Pi</p>
            <h1>NTP server dashboard</h1>
          </div>
          <button id="refreshButton" class="secondary-button" type="button">Refresh</button>
        </div>

        <div class="status-grid">
          <article class="status-card">
            <span class="label">IP address</span>
            <strong id="ipAddress">—</strong>
          </article>
          <article class="status-card">
            <span class="label">Internet</span>
            <strong id="internetConnected">—</strong>
          </article>
          <article class="status-card">
            <span class="label">NTP / Time</span>
            <strong id="timeValue">—</strong>
          </article>
          <article class="status-card">
            <span class="label">CPU</span>
            <strong id="cpuValue">—</strong>
          </article>
          <article class="status-card">
            <span class="label">Temperature</span>
            <strong id="tempValue">—</strong>
          </article>
          <article class="status-card">
            <span class="label">RAM</span>
            <strong id="ramValue">—</strong>
          </article>
        </div>

        <p id="statusMessage" class="message" role="status"></p>

        <details class="raw-json">
          <summary>Raw exporter data</summary>
          <pre id="rawPayload">{}</pre>
        </details>
      </section>

      <section class="panel">
        <p class="eyebrow">Network configuration</p>
        <h2>Update eth1 address</h2>
        <p id="interfaceLabel" class="helper-text">Address format: 192.168.1.50/24</p>

        <form id="networkForm" class="form">
          <label for="ipAddressInput">New address</label>
          <input
            id="ipAddressInput"
            name="ipAddress"
            type="text"
            placeholder="192.168.1.50/24"
            autocomplete="off"
            required
          />
          <button class="primary-button" type="submit">Apply address</button>
        </form>

        <p id="formMessage" class="message" role="status"></p>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
